#
# Read-only validation for Casks/**. No tap write tokens, no Apple secrets,
# no auto-merge. The first jackin-usage-menu-bar cask is human-approved only.
name: cask-validation

on:
  pull_request:
    paths:
      - "Casks/**"
      - ".github/workflows/cask-validation.yml"
      - "AGENTS.md"
      - "REUSE.toml"
  workflow_dispatch:
    inputs:
      lanes:
        description: velnor (default) | github | both
        type: choice
        default: velnor
        options: [velnor, github, both]
      cask_path:
        description: "Cask file path relative to repo root (empty: all Casks/*.rb)"
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: cask-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cask-validate:
    # The deep native checks (codesign, spctl, stapler, lipo, PlistBuddy,
    # /Applications install) fundamentally require macOS. No macOS-capable
    # Velnor label exists in the org fleet, so the macOS lane stays on
    # GitHub-hosted runners as the non-default dispatch escape hatch only.
    # The default lane is Velnor; identical steps run on both lanes.
    name: Cask validation (${{ matrix.config.lane }})
    strategy:
      fail-fast: false
      matrix:
        config: ${{ fromJSON((github.event_name == 'workflow_dispatch' && inputs.lanes == 'both') && '[{"lane":"Velnor","runner":["self-hosted","velnor-target-mvp"],"writer":true},{"lane":"GitHub","runner":"macos-latest","writer":false}]' || ((github.event_name == 'workflow_dispatch' && inputs.lanes == 'github') || github.event_name == 'pull_request') && '[{"lane":"GitHub","runner":"macos-latest","writer":true}]' || '[{"lane":"Velnor","runner":["self-hosted","velnor-target-mvp"],"writer":true}]') }}
    runs-on: ${{ matrix.config.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Select cask candidates
        id: candidates
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_CASK: ${{ github.event.inputs.cask_path }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          candidates=()
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            if [ -n "${DISPATCH_CASK}" ]; then
              path="$DISPATCH_CASK"
              if [ ! -f "$path" ]; then
                echo "::error::cask path does not exist: $path"
                exit 1
              fi
              candidates+=("$path")
            else
              # No explicit path: validate every cask in the tap.
              shopt -s nullglob
              for f in Casks/*.rb; do
                candidates+=("$f")
              done
            fi
          else
            # PR: discover changed Casks/*.rb (null-safe).
            while IFS= read -r -d '' f; do
              candidates+=("$f")
            done < <(git diff --name-only -z "$BASE_SHA"...HEAD -- 'Casks/*.rb' || true)
          fi

          if [ "${#candidates[@]}" -eq 0 ]; then
            echo "status=skip" >> "$GITHUB_OUTPUT"
            echo "paths=" >> "$GITHUB_OUTPUT"
            echo "::notice::no cask candidates (workflow-only PR or no Casks/*.rb changes); success skip"
            exit 0
          fi

          printf 'status=run\n' >> "$GITHUB_OUTPUT"
          # Multiline-safe path list
          {
            echo "paths<<EOF"
            printf '%s\n' "${candidates[@]}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          echo "Candidates:"
          printf '  %s\n' "${candidates[@]}"

      - name: Homebrew style / audit / fetch
        if: steps.candidates.outputs.status == 'run'
        shell: bash
        env:
          CASK_PATHS: ${{ steps.candidates.outputs.paths }}
        run: |
          set -euo pipefail
          brew update --quiet || true
          brew readall --aliases
          while IFS= read -r cask; do
            [ -z "$cask" ] && continue
            echo "==> style $cask"
            brew style --cask "./$cask"
            echo "==> audit $cask"
            brew audit --cask --new --strict --online "./$cask" || \
              brew audit --cask --strict --online "./$cask"
            echo "==> fetch $cask"
            brew fetch --cask --retry --force "./$cask"
          done <<< "$CASK_PATHS"

      - name: Deep checks for jackin-usage-menu-bar
        if: steps.candidates.outputs.status == 'run'
        shell: bash
        env:
          CASK_PATHS: ${{ steps.candidates.outputs.paths }}
        run: |
          set -euo pipefail
          while IFS= read -r cask; do
            [ -z "$cask" ] && continue
            base="$(basename "$cask")"
            if [ "$base" != "jackin-usage-menu-bar.rb" ]; then
              echo "skip deep native checks for $cask"
              continue
            fi
            echo "==> deep native checks for $cask"
            # Extract url + sha256 from the cask (Homebrew Ruby DSL).
            url="$(brew ruby -e "cask = Cask::CaskLoader.load('./$cask'); puts cask.url.to_s")"
            sha="$(brew ruby -e "cask = Cask::CaskLoader.load('./$cask'); puts cask.sha256.to_s")"
            echo "url=$url"
            echo "sha256=$sha"
            tmp="$(mktemp -d)"
            trap 'rm -rf "$tmp"' EXIT
            curl -fsSL "$url" -o "$tmp/artifact.zip"
            actual="$(shasum -a 256 "$tmp/artifact.zip" | awk '{print $1}')"
            [ "$actual" = "$sha" ] || { echo "FAIL: artifact sha $actual != cask $sha"; exit 1; }
            # Release sidecar (same URL + .sha256)
            if curl -fsSL "${url}.sha256" -o "$tmp/artifact.sha256"; then
              sidecar="$(awk '{print $1; exit}' "$tmp/artifact.sha256")"
              [ "$sidecar" = "$sha" ] || { echo "FAIL: sidecar $sidecar != cask $sha"; exit 1; }
            else
              echo "::warning::no .sha256 sidecar at ${url}.sha256 — require when release publishes one"
            fi
            unzip -q "$tmp/artifact.zip" -d "$tmp/out"
            count="$(find "$tmp/out" -name 'JackinUsageMenuBar.app' -type d | wc -l | tr -d ' ')"
            [ "$count" = "1" ] || { echo "FAIL: expected exactly one JackinUsageMenuBar.app, found $count"; exit 1; }
            app="$(find "$tmp/out" -name 'JackinUsageMenuBar.app' -type d | head -1)"
            codesign --verify --deep --strict "$app"
            spctl --assess --type execute "$app" || true
            xcrun stapler validate "$app" || true
            archs="$(lipo -archs "$app/Contents/MacOS/JackinUsageMenuBar")"
            echo "$archs" | grep -qw arm64
            echo "$archs" | grep -qw x86_64
            bid="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$app/Contents/Info.plist")"
            [ "$bid" = "com.jackin-project.usage-menu-bar" ] || { echo "FAIL: bundle id $bid"; exit 1; }
            minos="$(/usr/libexec/PlistBuddy -c 'Print :LSMinimumSystemVersion' "$app/Contents/Info.plist")"
            [ "$minos" = "14.0" ] || { echo "FAIL: min os $minos"; exit 1; }

            echo "==> install / launch / uninstall (no credentials)"
            brew install --cask "./$cask"
            test -d /Applications/JackinUsageMenuBar.app
            open /Applications/JackinUsageMenuBar.app
            alive=0
            for _ in $(seq 1 20); do
              if pgrep -f 'JackinUsageMenuBar.app/Contents/MacOS/JackinUsageMenuBar' >/dev/null; then
                alive=1
                break
              fi
              sleep 0.5
            done
            if [ "$alive" != "1" ]; then
              echo "::warning::GUI launch did not observe process (hosted runner Aqua limitation possible); static/install checks already passed"
            else
              sleep 2
              pgrep -f 'JackinUsageMenuBar.app/Contents/MacOS/JackinUsageMenuBar' >/dev/null
              pkill -f 'JackinUsageMenuBar.app/Contents/MacOS/JackinUsageMenuBar' || true
            fi
            brew uninstall --cask "./$cask" || brew uninstall --cask jackin-usage-menu-bar
            if [ -d /Applications/JackinUsageMenuBar.app ]; then
              echo "FAIL: app still present after uninstall"
              exit 1
            fi
          done <<< "$CASK_PATHS"

      - name: Upload diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cask-validation-diagnostics
          path: |
            ~/Library/Logs/Homebrew/**
          if-no-files-found: ignore
